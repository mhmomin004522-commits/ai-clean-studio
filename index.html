<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Momin AI Clean Studio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070b12;
  color:#fff;
  min-height:100vh;
}

.container{
  width:92%;
  max-width:900px;
  margin:auto;
  padding:30px 0 50px;
}

header{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  background:linear-gradient(135deg,#00e5ff,#635bff);
  box-shadow:0 15px 40px rgba(0,229,255,.18);
}

h1{
  margin-top:16px;
  font-size:30px;
}

.subtitle{
  color:#9ca8ba;
  margin-top:8px;
  font-size:14px;
}

.card{
  background:#101722;
  border:1px solid #202b3a;
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.upload{
  border:2px dashed #334155;
  border-radius:18px;
  padding:40px 20px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.upload:hover{
  border-color:#00d9ff;
  background:#0c1622;
}

.upload-icon{
  font-size:45px;
  margin-bottom:12px;
}

.upload h2{
  font-size:20px;
}

.upload p{
  color:#8995a7;
  margin-top:8px;
  font-size:13px;
}

input[type=file]{
  display:none;
}

.preview{
  display:none;
  text-align:center;
}

.preview img{
  max-width:100%;
  max-height:420px;
  border-radius:16px;
  margin-top:15px;
  background:#05070a;
}

.filename{
  margin-top:12px;
  color:#cbd5e1;
  word-break:break-all;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:18px;
}

.info{
  background:#0b111b;
  border:1px solid #202b3a;
  border-radius:12px;
  padding:13px;
}

.info span{
  display:block;
  color:#78869a;
  font-size:11px;
  margin-bottom:5px;
}

.info strong{
  font-size:14px;
  word-break:break-word;
}

.status{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 15px;
  border-radius:12px;
  background:#0b111b;
  margin-top:10px;
}

.status-name{
  color:#cbd5e1;
  font-size:14px;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.ok{
  background:#12351f;
  color:#62e88a;
}

.warn{
  background:#392b0c;
  color:#ffc857;
}

.detected{
  background:#3a1515;
  color:#ff7777;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  margin-top:18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#00bcd4,#635bff);
  box-shadow:0 12px 30px rgba(0,188,212,.15);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.download{
  display:none;
  text-decoration:none;
  text-align:center;
  width:100%;
  margin-top:12px;
  padding:15px;
  border-radius:14px;
  background:#162235;
  border:1px solid #2b3a50;
  color:#fff;
  font-weight:bold;
}

.message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  background:#0d2418;
  color:#6ee7a0;
  font-size:13px;
  text-align:center;
}

.notice{
  color:#8995a7;
  font-size:12px;
  line-height:1.7;
  text-align:center;
  margin-top:15px;
}
