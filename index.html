<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Clean Studio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #172554);
  color: white;
}

.container {
  width: 92%;
  max-width: 600px;
  margin: auto;
  padding: 45px 0;
  text-align: center;
}

h1 {
  font-size: 38px;
  margin: 10px 0;
}

.subtitle {
  color: #cbd5e1;
  margin-bottom: 30px;
}

.upload-box {
  border: 2px dashed #64748b;
  border-radius: 22px;
  padding: 45px 20px;
  background: rgba(255,255,255,0.06);
  cursor: pointer;
}

.upload-box:hover {
  border-color: #38bdf8;
}

.upload-box input {
  display: none;
}

.camera {
  font-size: 60px;
}

.upload-title {
  font-size: 23px;
  margin-top: 15px;
}

.upload-info {
  color: #94a3b8;
  margin-top: 8px;
}

#preview {
  display: none;
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  margin-top: 25px;
  border-radius: 16px;
  background: #020617;
}

button,
.download {
  width: 100%;
  display: block;
  margin-top: 20px;
  padding: 16px;
  border: 0;
  border-radius: 13px;
  font-size: 16px;
  font-weight: bold;
  text-decoration: none;
}

#cleanButton {
  background: #38bdf8;
  color: #082f49;
}

#cleanButton:disabled {
  opacity: 0.45;
}

.download {
  background: #22c55e;
  color: white;
  display: none;
}

#status {
  margin-top: 20px;
  color: #cbd5e1;
  line-height: 1.5;
}

.info {
  margin-top: 35px;
  padding: 18px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  color: #94a3b8;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <h1>AI Clean Studio</h1>

  <p class="subtitle">
    Clean unnecessary image metadata
  </p>

  <div class="upload-box"
       onclick="document.getElementById('imageInput').click()">

    <input
      type="file"
      id="imageInput"
      accept="image/jpeg,image/png,image/webp">

    <div class="camera">📷</div>

    <div class="upload-title">
      Upload Image
    </div>

    <div class="upload-info">
      JPG, PNG or WEBP
    </div>

  </div>

  <img id="preview" alt="Image preview">

  <button id="cleanButton" disabled>
    CLEAN IMAGE
  </button>

  <div id="status"></div>

  <a id="downloadButton"
     class="download">
     ⬇ DOWNLOAD CLEAN IMAGE
  </a>

  <div class="info">
    🔒 Your image is processed locally in your browser.
    It is not uploaded to our server.
  </div>

</div>


<script>

const imageInput =
  document.getElementById("imageInput");

const cleanButton =
  document.getElementById("cleanButton");

const preview =
  document.getElementById("preview");

const status =
  document.getElementById("status");

const downloadButton =
  document.getElementById("downloadButton");


let selectedImage = null;


/* IMAGE SELECT */

imageInput.addEventListener("change", function() {

  if (!this.files || !this.files[0]) {
    return;
  }

  selectedImage = this.files[0];

  const imageURL =
    URL.createObjectURL(selectedImage);

  preview.src = imageURL;

  preview.style.display = "block";

  cleanButton.disabled = false;

  status.innerHTML =
    "Selected: <b>" +
    escapeHTML(selectedImage.name) +
    "</b><br>" +
    "Size: " +
    formatBytes(selectedImage.size);

  downloadButton.style.display = "none";

});


/* CLEAN IMAGE */

cleanButton.addEventListener("click", function() {

  if (!selectedImage) {
    return;
  }

  cleanButton.disabled = true;

  status.innerHTML =
    "⏳ Processing image...";


  const img = new Image();

  const imageURL =
    URL.createObjectURL(selectedImage);


  img.onload = function() {

    try {

      /*
       * Create a new canvas.
       * Drawing pixels to a fresh canvas and
       * exporting it creates a new image file
       * rather than copying the original
       * EXIF/metadata blocks.
       */

      const canvas =
        document.createElement("canvas");

      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;


      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0
      );


      /*
       * Export as JPEG.
       * The new file does not carry the original
       * browser-readable EXIF metadata.
       */

      canvas.toBlob(
        function(blob) {

          if (!blob) {

            throw new Error(
              "Could not create cleaned image."
            );

          }


          const downloadURL =
            URL.createObjectURL(blob);


          downloadButton.href =
            downloadURL;

          downloadButton.download =
            "cleaned-image.jpg";


          downloadButton.style.display =
            "block";


          status.innerHTML =
            "✅ Image processed successfully." +
            "<br><br>" +
            "Original: " +
            formatBytes(selectedImage.size) +
            "<br>" +
            "Cleaned: " +
            formatBytes(blob.size);


          cleanButton.disabled = false;


          URL.revokeObjectURL(imageURL);

        },

        "image/jpeg",

        0.95

      );

    }

    catch (error) {

      status.innerText =
        "❌ Processing failed: " +
        error.message;

      cleanButton.disabled = false;

    }

  };


  img.onerror = function() {

    status.innerText =
      "❌ Unable to read this image.";

    cleanButton.disabled = false;

  };


  img.src = imageURL;

});


/* FILE SIZE */

function formatBytes(bytes) {

  if (bytes === 0) {
    return "0 Bytes";
  }

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];

  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    parseFloat(
      (bytes /
      Math.pow(1024, index))
      .toFixed(2)
    )
    + " "
    + units[index]
  );

}


/* BASIC TEXT ESCAPE */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
